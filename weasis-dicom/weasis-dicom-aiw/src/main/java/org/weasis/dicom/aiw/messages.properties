# Title of the group of actions that send studies and series to analysis services, in the menus of the DICOM explorer
AiTasks.title=AI tasks
# Menu item that creates a task; {0} = the name of the task as the server names it
AiTasks.run=Run {0}
# Menu item of a task waiting to be taken by a performer, which cancels it; {0} = the name of the task
AiTasks.cancel=Cancel {0} (queued)
# Disabled menu item of a task waiting to be taken by a performer; {0} = the name of the task
AiTasks.queued=Queued: {0}
# Disabled menu item of a task being performed; {0} = the name of the task
AiTasks.running=Running: {0}
# Menu item that loads the results of a finished task; {0} = the name of the task
AiTasks.open=Open results of {0}
# Menu item that reads the state of the tasks again from the server
AiTasks.refresh=Refresh the task states
# Disabled menu item shown while the tasks of a study are read from the server for the first time
AiTasks.loading=Reading the tasks…
# Disabled menu item; {0} = the reason the server gave or the network error
AiTasks.failed=The tasks cannot be read: {0}
# max:6 Mark in the series list of a series with a task waiting or running
AiTasks.badge.pending=AI…
# max:6 Mark in the series list of a series whose task results are ready to open
AiTasks.badge.ready=AI✓
# Title of the preference page of the servers that take AI tasks
AiTasksPrefView.title=AI Tasks
# Title of a section of AiTasksPrefView
AiTasksPrefView.servers=Servers
# Explanation at the top of the "Servers" section of AiTasksPrefView
AiTasksPrefView.servers.hint=A study loaded from an enabled server shows the AI tasks group in the explorer. Without "Create tasks" the group only shows the tasks and opens their results.
# max:28 Button of AiTasksPrefView that lists the DICOMweb nodes of the preferences
AiTasksPrefView.add_node=Add a DICOMweb node…
# max:28 Button of AiTasksPrefView that asks for the address of a server
AiTasksPrefView.add_url=Add a URL…
# max:20 Button of AiTasksPrefView
AiTasksPrefView.remove=Remove
# Disabled menu item of AiTasksPrefView when every DICOMweb node is already listed or none exists
AiTasksPrefView.no_node=No other DICOMweb node
# Text of the dialog of AiTasksPrefView that asks for the address of a server
AiTasksPrefView.url_prompt=Root URL of the DICOMweb server (for studies loaded without a node):
# Title of the section of AiTasksPrefView that shows the settings of a server, while none is selected
AiTasksPrefView.server=Server settings
# Title of that section for the selected server; {0} = the name or the address of the server
AiTasksPrefView.server_of=Settings of {0}
# Text of AiTasksPrefView in place of the settings while no server is selected
AiTasksPrefView.no_server=Add a server, or select one in the list, to set the tasks it offers.
# Label of AiTasksPrefView: the AE title this application gives to the server
AiTasksPrefView.aet=Requester AE title
# max:60 Check box of AiTasksPrefView
AiTasksPrefView.aet_in_path=AE title in the subscription path (dcm4chee-arc)
# Label of AiTasksPrefView, followed by a number and the word "seconds"
AiTasksPrefView.poll=Read the tasks again every
# Unit after the number of the "Read the tasks again every" field of AiTasksPrefView
AiTasksPrefView.seconds=seconds
# Explanation under the "Read the tasks again" field of AiTasksPrefView
AiTasksPrefView.poll.hint=Only while a task is waiting or running; never more often than every 10 seconds, 0 for never.
# Label of AiTasksPrefView above the table of the tasks a server offers
AiTasksPrefView.catalog=Tasks offered
# Explanation under the table of tasks of AiTasksPrefView
AiTasksPrefView.catalog.hint=The codes are the ones the site set on the server; a row without a code or a scheme is not kept.
# max:20 Button of AiTasksPrefView that adds a row to the table of tasks
AiTasksPrefView.add_task=Add a task
# max:30 Column header of AiTasksPrefView
AiTasksPrefView.col_server=Server
# max:14 Column header of AiTasksPrefView
AiTasksPrefView.col_enabled=Enabled
# max:14 Column header of AiTasksPrefView: tasks may be created and canceled
AiTasksPrefView.col_write=Create tasks
# max:20 Column header of AiTasksPrefView: the value of a task code
AiTasksPrefView.col_code=Code
# max:20 Column header of AiTasksPrefView: the coding scheme designator
AiTasksPrefView.col_scheme=Scheme
# max:30 Column header of AiTasksPrefView: the text of a task code
AiTasksPrefView.col_meaning=Meaning
