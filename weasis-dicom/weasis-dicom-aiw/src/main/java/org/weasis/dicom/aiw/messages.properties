# Title of the group of actions that send studies and series to analysis services, in the menus of the DICOM explorer
AiTasks.title=AI tasks
# Menu item that creates a task; {0} = the name of the task as the server names it
AiTasks.run=Run {0}
# Menu item of a task waiting to be taken by a performer, which cancels it; {0} = the name of the task
AiTasks.cancel=Cancel {0} (queued)
# Disabled menu item of a task waiting to be taken by a performer; {0} = the name of the task
AiTasks.queued=Queued: {0}
# Disabled menu item of a task being performed; {0} = the name of the task
AiTasks.running=Running: {0}
# Menu item that loads the results of a finished task; {0} = the name of the task
AiTasks.open=Open results of {0}
# Menu item that reads the state of the tasks again from the server
AiTasks.refresh=Refresh the task states
# Disabled menu item shown while the tasks of a study are read from the server for the first time
AiTasks.loading=Reading the tasks…
# Disabled menu item; {0} = the reason the server gave or the network error
AiTasks.failed=The tasks cannot be read: {0}
# max:6 Mark in the series list of a series with a task waiting or running
AiTasks.badge.pending=AI…
# max:6 Mark in the series list of a series whose task results are ready to open
AiTasks.badge.ready=AI✓
