version: 2
updates:
  # Keep pinned GitHub Actions SHAs (and their version comments) up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Maven dependencies for the multi-module reactor (discovered from the root pom).
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      maven:
        patterns:
          - "*"
    # OpenCV 5.1 and weasis-core-img 5.1 belong to the Weasis 5.0 line (OpenCV 5.1.0-dcm also
    # renames the Linux classifiers); keep master on 5.0.x and take patch releases only.
    ignore:
      - dependency-name: "org.weasis.thirdparty.org.opencv:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.weasis.core:weasis-core-img"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]