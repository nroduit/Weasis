# Tooltip of WeasisWin
WeasisWin.anonymize=Anonymize displayed data
# Tooltip of WeasisWin
WeasisWin.anonymize.tip=Substitute patient identity in annotations, tab titles and the explorer
# Text shown by WeasisWin
WeasisWin.anonymize.warn=<html><body>Patient identifiers are replaced on screen and in the images Weasis renders (screenshots, prints, image exports), but this is <b>not a de-identification</b>.<ul><li>Text burned into the image pixels is <b>not hidden automatically</b>: draw closed shapes over it and apply them with the <b>Redaction Bar</b> of the 2D viewer.</li><li>DICOM files exported or sent from Weasis <b>keep their original attributes</b>. To de-identify DICOM data, use <a href="https://karnak.weasis.org/">Karnak</a>.</li></ul>Always review every image before sharing it.</body></html>
