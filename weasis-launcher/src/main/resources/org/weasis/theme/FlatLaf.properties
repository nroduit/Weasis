# text
micro.font = -4
small.semibold.font = -2 $semibold.font
mini.semibold.font = -3 $semibold.font
micro.semibold.font = -4 $semibold.font

# popups
# On macOS, FlatLaf forces every popup into a native window to draw the drop shadow, and AppKit
# animates such windows when they appear. Dropping the shadow lets popups that fit inside the frame
# stay lightweight, so they show up instantly instead of scaling in.
[mac]Popup.dropShadowPainted = false

# styles
[style].micro = font: $micro.font
[style].small.semibold = font: $small.semibold.font
[style].mini.semibold= font: $mini.semibold.font
[style].micro.semibold = font: $micro.semibold.font

# Auramed portal orange (#fb923c) for app buttons — visible on dark-blue screens.
# Menu selection uses the same orange with black text (see LookAndFeels + theme JSON).
Button.background = #fb923c
Button.foreground = #0f172a
Button.hoverBackground = #f97316
Button.pressedBackground = #ea580c
Button.borderColor = #fb923c
Button.focusedBorderColor = #fdba74
Button.selectedBackground = #f97316
Button.selectedForeground = #0f172a
Button.default.background = #fb923c
Button.default.foreground = #0f172a
Button.default.hoverBackground = #f97316
Button.default.pressedBackground = #ea580c

# Toolbar / toggle: selected tool is orange; hover is soft orange (not solid fill for icons).
Button.toolbar.selectedBackground = #fb923c
Button.toolbar.selectedForeground = #0f172a
Button.toolbar.hoverBackground = #fb923c40
Button.toolbar.pressedBackground = #fb923c70
ToggleButton.selectedBackground = #fb923c
ToggleButton.selectedForeground = #0f172a
ToggleButton.toolbar.selectedBackground = #fb923c
ToggleButton.toolbar.selectedForeground = #0f172a
ToggleButton.toolbar.hoverBackground = #fb923c40
ToggleButton.toolbar.pressedBackground = #fb923c70

# Menus: orange selection + black text
Menu.selectionBackground = #fb923c
Menu.selectionForeground = #0f172a
MenuBar.selectionBackground = #fb923c
MenuBar.selectionForeground = #0f172a
MenuItem.selectionBackground = #fb923c
MenuItem.selectionForeground = #0f172a
CheckBoxMenuItem.selectionBackground = #fb923c
CheckBoxMenuItem.selectionForeground = #0f172a
RadioButtonMenuItem.selectionBackground = #fb923c
RadioButtonMenuItem.selectionForeground = #0f172a

# Tabs: selected tab orange + black text
TabbedPane.tabType = card
TabbedPane.selectedBackground = #fb923c
TabbedPane.selectedForeground = #0f172a
TabbedPane.underlineColor = #fb923c
TabbedPane.inactiveUnderlineColor = #fb923c80
TabbedPane.focusColor = #fb923c40
ToggleButton.tab.selectedBackground = #fb923c
ToggleButton.tab.selectedForeground = #0f172a
ToggleButton.tab.underlineColor = #fb923c
