# text
micro.font = -4
small.semibold.font = -2 $semibold.font
mini.semibold.font = -3 $semibold.font
micro.semibold.font = -4 $semibold.font

# popups
# On macOS, FlatLaf forces every popup into a native window to draw the drop shadow, and AppKit
# animates such windows when they appear. Dropping the shadow lets popups that fit inside the frame
# stay lightweight, so they show up instantly instead of scaling in.
[mac]Popup.dropShadowPainted = false

# styles
[style].micro = font: $micro.font
[style].small.semibold = font: $small.semibold.font
[style].mini.semibold= font: $mini.semibold.font
[style].micro.semibold = font: $micro.semibold.font
