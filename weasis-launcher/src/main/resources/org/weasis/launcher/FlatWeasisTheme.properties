#
# The dark theme of Weasis, on top of the FlatLaf dark theme.
#
# The colors come from the Monokai Pro theme of Material Theme UI (Mallowigi), which Weasis used
# as an IntelliJ theme file until 5.0, with a blue selection, the accent as selected text, darker
# component backgrounds and the standard colors of the action icons. This file states the
# values that theme gave to the keys FlatLaf reads, except the selection: one brighter blue, used
# for the selected tab, table row and toggle button as well. What is not listed is the FlatLaf
# dark theme, computed from the variables below.
#
# See https://www.formdev.com/flatlaf/properties-files/ for the syntax.

#---- palette ----

# window and panel background, and the text on it
@bg = #2d2a2e
@fg = #fcfcfa
# secondary text: accelerators, tool icons
@text = #939293
# disabled text and outlines
@dis = #5b595c
# selection background (blue): what is selected is filled with it, in menus, lists, trees, tables,
# tabs and toggle buttons alike; gray is for hover and for a selection that is not the active one
# accent (yellow): selected text, focus, links, marks
@selBg = #2f4c85
@accent = #ffd866
# backgrounds, from the darkest (fields, trees, toolbars) to the lightest (buttons)
@cs = #221f22
@notif = #363437
@excl = #3a3a3c
@second = #403e41
@table = #4a474b

#---- variables ----

@background = @bg
@foreground = @fg
@disabledForeground = @dis
@accentColor = @accent
@selectionBackground = @selBg
@selectionForeground = @accent
@selectionInactiveBackground = @table
@buttonBackground = @table
@componentBackground = @cs
@cellFocusColor = #222

#---- system colors ----

