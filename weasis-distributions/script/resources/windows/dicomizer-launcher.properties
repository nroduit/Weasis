# All three native launchers start the bootstrap (stage 1), which resolves the launcher set and
# spawns the application (stage 2) with the JVM options the package serves. The entry class names
# the application, so the X11 window class groups its windows under StartupWMClass. jpackage
# discards the --java-options of the main launcher as soon as this file defines java-options, so
# the stage-1 set is repeated here. The Dicomizer reads its configuration from conf/dicomizer.json
# and opts out of the AOT cache.
main-class=org.weasis.bootstrap.Bootstrap
main-jar=weasis-bootstrap.jar
java-options=-Dweasis.bootstrap.entry=org.weasis.launcher.Dicomizer -Dweasis.extended.config.properties=file:conf/dicomizer.json \
-Dweasis.aot.cache=false -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xshare:auto -Xmx96m \
-splash:$APPDIR\\resources\\images\\about-round.png
