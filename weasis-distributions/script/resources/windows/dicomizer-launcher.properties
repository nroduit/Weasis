# jpackage discards the --java-options of the main launcher as soon as this file defines
# java-options, so every option needed by the Dicomizer must be repeated below. Deployment options
# pointing to a remote configuration service are deliberately not repeated: the Dicomizer reads its
# configuration from conf/dicomizer.json.
main-class=org.weasis.launcher.AppLauncher
main-jar=weasis-launcher.jar
java-options=-Dfelix.extended.config.properties=file:conf/dicomizer.json -Dgosh.port=17179 \
--enable-native-access=ALL-UNNAMED -XX:MaxRAMPercentage=25 -XX:+UseStringDeduplication \
-splash:$APPDIR\\resources\\images\\about-round.png \
-Djavax.accessibility.assistive_technologies=org.weasis.launcher.EmptyAccessibilityProvider \
-Djavax.accessibility.screen_magnifier_present=false