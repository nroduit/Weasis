# All three native launchers start the bootstrap (stage 1). On macOS the launcher set runs in the
# bootstrap process itself (open-file events reach the first process), so the application options
# are native and repeated here; they must match weasis.launcher.jvm-options of the pom. jpackage
# discards the --java-options of the main launcher as soon as this file defines java-options. The
# Dicomizer reads its configuration from conf/dicomizer.json.
main-class=org.weasis.bootstrap.Bootstrap
main-jar=weasis-bootstrap.jar
java-options=-Dweasis.bootstrap.entry=org.weasis.launcher.Dicomizer -Dweasis.extended.config.properties=file:conf/dicomizer.json \
--enable-native-access=ALL-UNNAMED -XX:MaxRAMPercentage=25 -XX:+UseStringDeduplication \
-Dapple.laf.useScreenMenuBar=true -Dapple.awt.application.appearance=NSAppearanceNameDarkAqua \
-splash:$APPDIR/resources/images/about-round.png \
-Djavax.accessibility.assistive_technologies=org.weasis.launcher.EmptyAccessibilityProvider \
-Djavax.accessibility.screen_magnifier_present=false
