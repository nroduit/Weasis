main-class=org.weasis.launcher.AppLauncher
main-jar=weasis-launcher.jar
java-options=-Dweasis.extended.config.properties=file:conf/dicomizer.json -Dweasis.launch.type=NATIVE -javaagent:$APPDIR/weasis-launcher.jar -Dapple.laf.useScreenMenuBar=true \
--enable-native-access=ALL-UNNAMED -splash:$APPDIR/resources/images/about-round.png \
-Djavax.accessibility.assistive_technologies=org.weasis.launcher.EmptyAccessibilityProvider \
-Djavax.accessibility.screen_magnifier_present=false
