# All three native launchers start the bootstrap (stage 1). On macOS the bootstrap replaces itself
# (execv, same PID) by the stage-2 JVM, so no splash here: AppKit must stay untouched until then and
# stage 2 shows it. The other options only serve the fallback that runs the launcher set in the
# bootstrap process; they must match weasis.launcher.jvm-options of the pom, except the
# accessibility provider, which names the class of weasis-bootstrap.jar (the only jar of the system
# class loader in this process). jpackage discards the --java-options of the main launcher as soon
# as this file defines java-options. The Dicomizer reads its configuration from conf/dicomizer.json.
main-class=org.weasis.bootstrap.Bootstrap
main-jar=weasis-bootstrap.jar
java-options=-Dweasis.bootstrap.entry=org.weasis.launcher.Dicomizer -Dweasis.extended.config.properties=file:conf/dicomizer.json \
--enable-native-access=ALL-UNNAMED -XX:MaxRAMPercentage=25 -XX:+UseStringDeduplication \
-Dapple.laf.useScreenMenuBar=true -Dapple.awt.application.appearance=NSAppearanceNameDarkAqua \
-Djavax.accessibility.assistive_technologies=org.weasis.bootstrap.EmptyAccessibilityProvider \
-Djavax.accessibility.screen_magnifier_present=false
