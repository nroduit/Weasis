# Command-line client of the running Weasis instance (weasis-cli). jpackage discards the
# --java-options of the main launcher for an additional launcher, so the options below are the
# complete set: no splash screen, a JVM tuned for a short-lived process. The client trains and
# uses its own per-user AOT cache (ClientAotCache), persisted into this launcher's .cfg.
main-class=org.weasis.launcher.CommandClient
main-jar=weasis-launcher.jar
description=Weasis command-line client
java-options=-XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xshare:auto -Dlogback.statusListenerClass=ch.qos.logback.core.status.NopStatusListener
