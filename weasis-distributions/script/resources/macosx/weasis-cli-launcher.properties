# Command-line client of the running Weasis instance (weasis-cli). It starts the bootstrap like the
# other launchers (kind cli): no configuration fetch, the launcher set the application ran last,
# and its own per-user AOT cache trained in a detached process after a call. jpackage discards the
# --java-options of the main launcher for an additional launcher, so the options below are the
# complete stage-1 set; the stage-2 options come from weasis.launcher.jvm-options.cli.
main-class=org.weasis.bootstrap.Bootstrap
main-jar=weasis-bootstrap.jar
description=Weasis command-line client
java-options=-Dweasis.bootstrap.kind=cli -Dweasis.bootstrap.entry=org.weasis.launcher.CommandClient -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xshare:auto -Dlogback.statusListenerClass=ch.qos.logback.core.status.NopStatusListener
