# Command-line client of the running Weasis instance (weasis-cli). It starts the bootstrap like the
# other launchers (kind cli): no configuration fetch, the launcher set the application ran last.
# On macOS the client runs in this launcher process, replaced once by itself with its per-user AOT
# cache in JAVA_TOOL_OPTIONS (trained in a detached launcher after a call), so the options below
# are those of the client too. No -Xshare option: the JVM refuses one next to the AOT flags.
# jpackage discards the --java-options of the main launcher for an additional launcher, so the
# options below are the complete set.
main-class=org.weasis.bootstrap.Bootstrap
main-jar=weasis-bootstrap.jar
description=Weasis command-line client
java-options=-Dweasis.bootstrap.kind=cli -Dweasis.bootstrap.entry=org.weasis.launcher.CommandClient -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dlogback.statusListenerClass=ch.qos.logback.core.status.NopStatusListener
